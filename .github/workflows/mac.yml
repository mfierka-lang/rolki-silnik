# Test silnika na Macu w chmurze GitHuba (Apple Silicon), dokładnie tą drogą, którą przejdzie użytkownik:
# silnik sam pobiera narzędzia i modele (instalator), potem montuje dwie rolki próbne i uruchamia serwer z interfejsem.
name: Mac

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      DANE: ${{ github.workspace }}/dane
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: silnik/go.mod
          cache: false

      - name: Maszyna
        run: |
          sysctl -n machdep.cpu.brand_string
          sw_vers | tr '\n' ' '
          echo "pamięć: $(( $(sysctl -n hw.memsize) / 1073741824 )) GB"

      - name: Pamięć podręczna modeli
        uses: actions/cache@v4
        with:
          path: dane/modele
          key: modele-v1

      - name: Silnik (vet + budowa)
        run: |
          mkdir -p "$DANE" wyniki
          cd silnik
          go vet ./...
          go build -o "$DANE/montaz" .
          "$DANE/montaz" wersja
          codesign -dv "$DANE/montaz" 2>&1 | grep -E "Signature|flags" || true

      - name: Synchronizacja z panelem i samoaktualizacja (udawany panel, klucz testowy)
        run: |
          cd silnik
          node test-synchro.mjs

      - name: Instalator (silnik sam pobiera narzędzia i modele)
        run: |
          # ffmpeg z systemu nie może pomagać: sprawdzamy to, co pobiera instalator
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin"
          time "$DANE/montaz" instaluj --dane "$DANE" | grep -v "Pobieram" || true
          ls "$DANE/bin" "$DANE/whisper" | tr '\n' ' '; echo
          "$DANE/bin/ffmpeg" -hide_banner -version | head -1
          "$DANE/bin/ffprobe" -hide_banner -version | head -1
          "$DANE/whisper/whisper-cli" --help 2>&1 | head -2
          "$DANE/llama/llama-server" --version 2>&1 | head -2

      - name: Sylwetka osoby (ONNX Runtime bez cgo, napis za osobą)
        run: |
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin"
          ls "$DANE/ort"
          "$DANE/montaz" sylwetka --dane "$DANE" --czas 2 probki/test-mowa-ujecia.mp4 wyniki/mac-maska.mkv

      - name: Rolka mówiona
        run: |
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin"
          mkdir -p "$DANE/zlecenia/mowa"
          cat > "$DANE/zlecenia/mowa/zadanie.json" <<EOF
          {"pliki": ["$GITHUB_WORKSPACE/probki/test-mowa-ujecia.mp4"], "opis": "rolka mówiona o magnesach NFC dla restauracji", "dane": "$DANE", "praca": "$DANE/zlecenia/mowa"}
          EOF
          time "$DANE/montaz" wykonaj "$DANE/zlecenia/mowa/zadanie.json" > "$DANE/zlecenia/mowa/postep.txt" 2> "$DANE/zlecenia/mowa/bledy.txt" || true
          tail -2 "$DANE/zlecenia/mowa/postep.txt"; tail -c 1500 "$DANE/zlecenia/mowa/bledy.txt"
          cat "$DANE/zlecenia/mowa/wynik.json"
          cp "$DANE/zlecenia/mowa/rolka.mp4" wyniki/mac-rolka-mowiona.mp4
          cp "$DANE/zlecenia/mowa/wynik.json" wyniki/mac-rolka-mowiona.json

      - name: Rolka z ujęć
        if: always()
        run: |
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin"
          mkdir -p "$DANE/zlecenia/ujecia"
          cat > "$DANE/zlecenia/ujecia/zadanie.json" <<EOF
          {"pliki": ["$GITHUB_WORKSPACE/probki/test-mowa-ujecia.mp4"], "opis": "breloki i magnesy NFC, same ujęcia, dynamicznie", "dane": "$DANE", "praca": "$DANE/zlecenia/ujecia"}
          EOF
          time "$DANE/montaz" wykonaj "$DANE/zlecenia/ujecia/zadanie.json" > "$DANE/zlecenia/ujecia/postep.txt" 2> "$DANE/zlecenia/ujecia/bledy.txt" || true
          tail -2 "$DANE/zlecenia/ujecia/postep.txt"; tail -c 1500 "$DANE/zlecenia/ujecia/bledy.txt"
          cat "$DANE/zlecenia/ujecia/wynik.json"
          cp "$DANE/zlecenia/ujecia/rolka.mp4" wyniki/mac-rolka-ujecia.mp4
          cp "$DANE/zlecenia/ujecia/wynik.json" wyniki/mac-rolka-ujecia.json

      - name: Jakość 4K i 2K (duży obraz, enkoder sprzętowy, pamięć)
        if: always()
        run: |
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin"
          # nagranie próbne powiększone do 4K: sprawdzamy drogę obrazu i pamięć, nie ostrość
          "$DANE/bin/ffmpeg" -v error -y -i probki/test-mowa-ujecia.mp4 -vf scale=3840:2160:flags=bicubic -c:v libx264 -preset ultrafast -crf 20 -c:a copy "$RUNNER_TEMP/proba-4k.mp4"
          for PROBA in "ujecia4k|poziom|4k|breloki i magnesy NFC, same ujęcia" "mowa2k|pion|4k|rolka mówiona o magnesach NFC"; do
            IFS='|' read -r NAZWA FORMAT JAKOSC OPIS <<< "$PROBA"
            K="$DANE/zlecenia/$NAZWA"; mkdir -p "$K"
            printf '{"pliki": ["%s"], "opis": "%s", "format": "%s", "jakosc": "%s", "dane": "%s", "praca": "%s"}' "$RUNNER_TEMP/proba-4k.mp4" "$OPIS" "$FORMAT" "$JAKOSC" "$DANE" "$K" > "$K/zadanie.json"
            /usr/bin/time -l "$DANE/montaz" wykonaj "$K/zadanie.json" > "$K/postep.txt" 2> "$K/bledy.txt" || true
            tail -1 "$K/postep.txt" | cut -c1-300
            grep -E "real|maximum resident set size" "$K/bledy.txt" || tail -c 1200 "$K/bledy.txt"
            "$DANE/bin/ffprobe" -v error -select_streams v:0 -show_entries stream=codec_name,width,height,level,bit_rate:format=duration,size -of default=nw=1 "$K/rolka.mp4" | tr '\n' ' '; echo
            grep -o '"jakosc[^,]*' "$K/wynik.json" | tr '\n' ' '; echo
            cp "$K/wynik.json" "wyniki/mac-$NAZWA.json" || true
          done
          # film 4K z poziomych nagrań 4K ma mieć 3840 x 2160, rolka pionowa z tych samych nagrań najwyżej 2K
          test "$("$DANE/bin/ffprobe" -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$DANE/zlecenia/ujecia4k/rolka.mp4")" = "3840,2160"
          test "$("$DANE/bin/ffprobe" -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$DANE/zlecenia/mowa2k/rolka.mp4")" = "1440,2560"

      - name: Serwer lokalny i montaż przez interfejs (tak jak ze strony)
        if: always()
        run: |
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin"
          "$DANE/montaz" serwer --dane "$DANE" --okno=false > wyniki/serwer.log 2>&1 &
          sleep 3
          curl -s http://127.0.0.1:47615/api/stan; echo
          curl -s -o /dev/null -w "interfejs: %{http_code}\n" http://127.0.0.1:47615/
          curl -s -o /dev/null -w "obca strona: %{http_code}\n" -H "Origin: https://example.com" http://127.0.0.1:47615/api/stan
          ID=$(curl -s -X POST --data-binary @probki/test-mowa-ujecia.mp4 "http://127.0.0.1:47615/api/wrzuc?nazwa=proba.mp4" | sed -E 's/.*"id":"([^"]+)".*/\1/')
          printf '{"pliki":["%s"],"opis":"rolka mówiona o magnesach NFC"}' "$ID" > zlec.json
          curl -s -X POST -H "Content-Type: application/json" --data-binary @zlec.json http://127.0.0.1:47615/api/montuj; echo
          for i in $(seq 1 60); do sleep 4; S=$(curl -s http://127.0.0.1:47615/api/postep); echo "$S" | grep -q '"stan":"praca"' || break; done
          echo "$S" | cut -c1-600
          ZL=$(echo "$S" | sed -E 's/.*"id":"([^"]+)".*/\1/')
          curl -s -o wyniki/mac-rolka-z-interfejsu.mp4 -w "pobranie rolki: %{http_code} %{size_download} B\n" "http://127.0.0.1:47615/api/rolka/$ZL/pobierz"
          curl -s -X POST http://127.0.0.1:47615/api/zamknij; echo

      - name: Dzienniki
        if: always()
        run: |
          for d in mowa ujecia; do
            for f in "$DANE/zlecenia/$d"/*.log "$DANE/zlecenia/$d"/bledy.txt "$DANE/zlecenia/$d"/postep.txt; do
              [ -f "$f" ] && cp "$f" "wyniki/$d-$(basename "$f")" || true
            done
          done
          ls -la wyniki

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-wyniki
          path: wyniki
          retention-days: 14
